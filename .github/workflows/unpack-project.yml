name: Unpack project

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q this.zip -d extracted
          echo "Top-level extracted files:"
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          if git diff --cached --quiet; then
            echo "No extracted changes to commit"
          else
            git commit -m "Unpack project from this.zip"
            git push
          fi
